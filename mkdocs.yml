site_name: Interview Prep Notes
site_description: Free, self-paced software coding interview preparation — patterns, data structures, and complexity.
site_url: https://muhilvarnanv.github.io/software_coding_interview_prep/

repo_url: https://github.com/muhilvarnanv/software_coding_interview_prep
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/code-tags
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    # Default for new visitors: dark “IDE night”
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Problems:
      - problems/index.md
      - Sliding window:
          - problems/sliding-window/index.md
          - problems/sliding-window/max-sum-subarray-size-k.md
          - problems/sliding-window/longest-substring-without-repeating.md
          - problems/sliding-window/minimum-size-subarray-sum.md
          - problems/sliding-window/longest-repeating-character-replacement.md
          - problems/sliding-window/find-all-anagrams-in-string.md
      - Two pointers:
          - problems/two-pointers/index.md
          - problems/two-pointers/two-sum-ii-sorted.md
          - problems/two-pointers/valid-palindrome.md
          - problems/two-pointers/three-sum.md
          - problems/two-pointers/container-with-most-water.md
          - problems/two-pointers/merge-sorted-array.md
      - Prefix sum:
          - problems/prefix-sum/index.md
          - problems/prefix-sum/range-sum-query-immutable.md
          - problems/prefix-sum/subarray-sum-equals-k.md
          - problems/prefix-sum/find-pivot-index.md
          - problems/prefix-sum/subarray-sums-divisible-by-k.md
          - problems/prefix-sum/product-of-array-except-self.md
      - Tortoise and hare:
          - problems/tortoise-hare/index.md
          - problems/tortoise-hare/linked-list-cycle.md
          - problems/tortoise-hare/linked-list-cycle-ii.md
          - problems/tortoise-hare/middle-of-linked-list.md
          - problems/tortoise-hare/happy-number.md
          - problems/tortoise-hare/palindrome-linked-list.md
      - Two-pass:
          - problems/two-pass/index.md
          - problems/two-pass/remove-nth-node-from-end.md
          - problems/two-pass/replace-with-greatest-on-right.md
          - problems/two-pass/valid-anagram.md
          - problems/two-pass/sort-array-by-parity.md
          - problems/two-pass/relative-sort-array.md
      - Bit manipulation:
          - problems/bit-manipulation/index.md
          - problems/bit-manipulation/single-number.md
          - problems/bit-manipulation/number-of-1-bits.md
          - problems/bit-manipulation/reverse-bits.md
          - problems/bit-manipulation/missing-number.md
          - problems/bit-manipulation/power-of-two.md
      - Cyclic sort:
          - problems/cyclic-sort/index.md
          - problems/cyclic-sort/first-missing-positive.md
          - problems/cyclic-sort/find-all-numbers-disappeared.md
          - problems/cyclic-sort/find-the-duplicate-number.md
          - problems/cyclic-sort/set-mismatch.md
          - problems/cyclic-sort/missing-number-in-place.md
  - Code patterns:
      - code-patterns/index.md
      - code-patterns/sliding-window.md
      - code-patterns/prefix-sum.md
      - code-patterns/two-pointer.md
      - code-patterns/tortoise-hare.md
      - code-patterns/two-pass.md
      - code-patterns/bit-manipulation.md
      - code-patterns/cyclic-sort.md
  - Time & space complexity:
      - time-space-complexity/index.md
      - time-space-complexity/big-o.md
  - Arrays:
      - arrays/index.md
      - Two pointers: code-patterns/two-pointer.md
  - Hash tables:
      - hash-tables/index.md
      - hash-tables/frequency-maps.md

# Still built and reachable by URL / internal links; omitted from the sidebar.
not_in_nav: |
  concept-library/**

plugins:
  - search

extra:
  generator: false
