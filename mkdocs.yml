site_name: Interview Prep Notes
site_description: Free, self-paced software coding interview preparation — patterns, data structures, and complexity.
site_url: https://muhilvarnanv.github.io/software_coding_interview_prep/

repo_url: https://github.com/muhilvarnanv/software_coding_interview_prep
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/code-tags
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    # Default for new visitors: dark “IDE night”
    - scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Concept library:
      - concept-library/index.md
      - concept-library/contiguous-segment.md
      - concept-library/subsequence.md
      - concept-library/monotonic-progress.md
  - Code patterns:
      - index.md
      - code-patterns/sliding-window.md
      - code-patterns/two-pointer.md
  - Time & space complexity:
      - time-space-complexity/index.md
      - time-space-complexity/big-o.md
  - Arrays:
      - arrays/index.md
      - Two pointers: code-patterns/two-pointer.md
  - Hash tables:
      - hash-tables/index.md
      - hash-tables/frequency-maps.md

plugins:
  - search

extra:
  generator: false
